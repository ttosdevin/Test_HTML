<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arithmetic Quiz Demo</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --good: #22c55e;
      --bad: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, var(--bg) 100%);
      color: var(--text);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 4vw, 2.8rem);
    }

    .lead {
      color: var(--muted);
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .card {
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.26);
      overflow: hidden;
    }

    .card-head {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(56, 189, 248, 0.08), transparent);
    }

    .card-head h2 { margin: 0; font-size: 1.1rem; }
    .card-body { padding: 18px; }

    .field, .question {
      margin-bottom: 16px;
      padding: 14px;
      border-radius: 14px;
      background: #0b1220;
      border: 1px solid var(--border);
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .field input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #111827;
      color: var(--text);
      outline: none;
      font-size: 1rem;
    }

    .field input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .question h3 { margin: 0 0 12px; font-size: 1.02rem; }

    .choices { display: grid; gap: 10px; }

    label.choice {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      cursor: pointer;
      line-height: 1.35;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    label.choice:hover {
      transform: translateY(-1px);
      border-color: #3b82f6;
      background: #243244;
    }

    input[type="radio"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: var(--accent);
      min-height: 44px;
    }

    button.secondary {
      background: #1f2937;
      border: 1px solid var(--border);
    }

    .results {
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #0b1220;
      min-height: 64px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .results.good { border-color: rgba(34, 197, 94, 0.55); }
    .results.bad { border-color: rgba(239, 68, 68, 0.55); }
    .demo-note { color: var(--muted); font-size: 0.92rem; margin-top: 10px; }
    .hidden { display: none; }

    @media (max-width: 640px) {
      .wrap { padding: 14px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Arithmetic Quiz Demo</h1>
    <p class="lead">Publish this page on GitHub Pages, then use the Google Apps Script web app to save results in a Sheet.</p>

    <div class="card">
      <div class="card-head">
        <h2>Quiz</h2>
      </div>
      <div class="card-body">
        <form id="quizForm">
          <div class="field">
            <label for="studentName">Student name</label>
            <input type="text" id="studentName" name="studentName" placeholder="Enter your name" autocomplete="name" />
          </div>

          <div class="question">
            <h3>1) What is 7 + 5?</h3>
            <div class="choices">
              <label class="choice"><input type="radio" name="q1" value="10"> 10</label>
              <label class="choice"><input type="radio" name="q1" value="11"> 11</label>
              <label class="choice"><input type="radio" name="q1" value="12"> 12</label>
              <label class="choice"><input type="radio" name="q1" value="13"> 13</label>
            </div>
          </div>

          <div class="question">
            <h3>2) What is 9 - 4?</h3>
            <div class="choices">
              <label class="choice"><input type="radio" name="q2" value="3"> 3</label>
              <label class="choice"><input type="radio" name="q2" value="4"> 4</label>
              <label class="choice"><input type="radio" name="q2" value="5"> 5</label>
              <label class="choice"><input type="radio" name="q2" value="6"> 6</label>
            </div>
          </div>

          <div class="actions">
            <button type="submit">Submit</button>
            <button type="button" class="secondary" id="resetBtn">Reset</button>
          </div>
        </form>

        <div class="results" id="results">Your score will appear here.</div>
        <div class="demo-note">Correct answers: 7 + 5 = 12, and 9 - 4 = 5.</div>
      </div>
    </div>
  </div>

  <iframe name="hiddenTarget" id="hiddenTarget" class="hidden" title="hidden submit target"></iframe>

  <script>
    // Google Apps Script web app URL (must be deployed as a Web app with access set to Anyone)
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzp0L2At4bgjqouv4q07e-aRZI8ILVGCjt7NzFnMu2_WZ5EDsbGKTj30Pl7GbBoNVxJrw/exec';

    const quizForm = document.getElementById('quizForm');
    const results = document.getElementById('results');
    const resetBtn = document.getElementById('resetBtn');
    const studentName = document.getElementById('studentName');

    const answers = { q1: '12', q2: '5' };

    function scoreQuiz(formData) {
      const q1 = formData.get('q1');
      const q2 = formData.get('q2');
      let score = 0;
      const missed = [];

      if (q1 === answers.q1) score++; else missed.push('Question 1');
      if (q2 === answers.q2) score++; else missed.push('Question 2');

      return { score, total: 2, missed };
    }

    function sendResultViaForm(payload) {
      return new Promise((resolve) => {
        const sender = document.createElement('form');
        sender.method = 'POST';
        sender.action = WEB_APP_URL;
        sender.target = 'hiddenTarget';
        sender.style.display = 'none';

        Object.entries(payload).forEach(([key, value]) => {
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = key;
          input.value = String(value);
          sender.appendChild(input);
        });

        document.body.appendChild(sender);
        sender.submit();

        // Give the browser a moment to send the POST before cleaning up.
        setTimeout(() => {
          sender.remove();
          resolve();
        }, 1200);
      });
    }

    quizForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(quizForm);
      const name = (studentName.value || '').trim() || 'Unnamed student';
      const { score, total, missed } = scoreQuiz(formData);

      const payload = {
        name,
        score,
        total,
        percent: Math.round((score / total) * 100),
        q1: formData.get('q1') || '',
        q2: formData.get('q2') || '',
        submittedAt: new Date().toISOString()
      };

      results.className = 'results';
      results.textContent = `Submitting...
${name} scored ${score}/${total}.`;

      try {
        await sendResultViaForm(payload);
        results.className = 'results ' + (score === total ? 'good' : score === 0 ? 'bad' : '');
        results.textContent = `Sent to Google Sheet.
${name} scored ${score}/${total}.
${missed.length ? 'Review: ' + missed.join(', ') + '.' : 'Perfect score!'}`;
      } catch (err) {
        results.className = 'results bad';
        results.textContent = `Score calculated, but the save request failed.
${name} scored ${score}/${total}.`;
      }
    });

    resetBtn.addEventListener('click', () => {
      quizForm.reset();
      results.className = 'results';
      results.textContent = 'Your score will appear here.';
      studentName.focus();
    });
  </script>
</body>
</html>
